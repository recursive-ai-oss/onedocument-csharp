name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build output goes outside the checkout, as it does locally; the runner context is only available inside steps.
      - name: Artifacts directory
        run: echo "ONEDOCUMENT_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Restore, build, test, NativeAOT smoke (warnings are errors)
        env:
          RID: ${{ matrix.rid }}
        run: build/ci.sh restore build test aot

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        run: echo "ONEDOCUMENT_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Browser WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish the browser-wasm smoke host and run it in headless Chromium
        env:
          ONEDOCUMENT_HOME: ${{ runner.temp }}/onedocument-home
          CI_OUT: ${{ runner.temp }}/out
        run: build/ci.sh restore wasm-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wasm-run-log
          path: ${{ runner.temp }}/out/wasm-run.log
          if-no-files-found: ignore

  pack:
    # Builds the packages as an artifact only; nothing is pushed anywhere.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts directory
        run: echo "ONEDOCUMENT_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pack
        env:
          CI_OUT: ${{ runner.temp }}/out
        run: build/ci.sh restore build pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/out/packages/*
          if-no-files-found: error
